- name: filters
  hosts: local
  connection: local
  tasks:
  - name: handle the undefined variables
    ansible.builtin.debug:
      msg: "Hello {{person | default('Jithesh')}}"
  - name: convert string to list
    vars:
      fruits: "apple,banana,orange"
    ansible.builtin.debug:
      msg: "{{fruits | split(',')}}"
  - name: convert map to list
    vars:
      course:
        name: devops
        duration: 120hrs
        trainer: shivakumar
    ansible.builtin.debug:
      msg: "course info:- {{course | dict2items}}"
  - name: convert list to map
    vars:
      course:
        - {'key': 'name', 'value': 'devops'}
        - {'key': 'duration ', 'value': '120hrs'}
        - {'key': 'trainer', 'value': 'shivakumar'}
    ansible.builtin.debug:
      msg: "{{course | items2dict}}"
- name: convert upper to lower
  vars:
    name: "L JITHESH"
  ansible.builtin.debug:
    msg: "{{name | lower}}"
- name: convert upper to lower
  vars:
    name: "L JITHESH"
  ansible.builtin.debug:
    msg: "{{name | lower}}"
- name: find min and max
  vars:
    number: [1,38,57,87,98]
  ansible.nuiltin.debug:
    msg: "min is :- {{number|min}} and max is :- {{number|max}}" 

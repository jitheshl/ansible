- name: getting var from prompt
  hosts: local
  connection: local
  vars_prompt:
  - name: course
    prompt: enter the course name:-
    private: false
  - name: name
    prompt: enter the instructor name:- 
    private: false
  - name: duration
    prompt: enter the duration:-
    private: false
  tasks:
    - name: print the variable
      ansible.builtin.debug:
        msg: This course is {{course}} and instructor name is {{name}} and duration is {{duration}} 